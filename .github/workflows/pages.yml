# ─────────────────────────────────────────────────────────────
# Publication de l'interface web sur GitHub Pages, à chaque modification de main.
#
# Les registres d'exemple proposés par l'interface sont les exports JSON du MÊME commit
# (examples/), vérifiés à jour avant publication : le site ne peut pas diverger de l'outil.
#
# GitHub Pages n'est pas disponible pour un dépôt privé d'un compte gratuit : tant que le dépôt
# est privé, le site est construit et testé, mais pas publié.
# ─────────────────────────────────────────────────────────────
name: Pages

on:
    push:
        branches: [main]
    workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

# Droits minimaux : lire le code, publier sur Pages, prouver l'identité du workflow (OIDC)
permissions:
    contents: read
    pages: write
    id-token: write

# Un seul déploiement à la fois ; on ne coupe jamais un déploiement en cours
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Construire le site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            # Les exports publiés doivent correspondre aux registres d'exemple de ce commit
            - name: Vérifier les registres et leurs exports
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  risk-check
                  python scripts/build_examples.py --check

            - name: Installer Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            # On reteste avant de publier : un site cassé n'est jamais mis en ligne
            - name: Installer, tester, construire
              working-directory: web
              run: |
                  npm ci
                  npm run typecheck
                  npm test
                  npm run build

            # Le site publié ne contient QUE ce dont le navigateur a besoin
            # (ni sources TypeScript, ni tests, ni node_modules)
            - name: Assembler le site
              run: |
                  mkdir -p _site/dist _site/data
                  cp web/index.html web/styles.css _site/
                  cp web/dist/*.js _site/dist/
                  for lang in fr en; do
                      for name in atelier-lumen atelier-lumen-ebios; do
                          cp "examples/$lang/$name.json" "_site/data/$name.$lang.json"
                      done
                  done
                  ls -R _site

            - name: Configurer Pages
              if: ${{ !github.event.repository.private }}
              uses: actions/configure-pages@v5

            - name: Empaqueter le site
              if: ${{ !github.event.repository.private }}
              uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

    deploy:
        name: Publier
        needs: build
        if: ${{ !github.event.repository.private }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # L'environnement « github-pages » affiche l'adresse du site dans GitHub
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Déployer sur GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
