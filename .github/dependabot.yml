# ─────────────────────────────────────────────────────────────
# Dependabot : propose automatiquement (par Pull Request)
# les mises à jour des actions GitHub et des outils de développement.
# ─────────────────────────────────────────────────────────────
version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "weekly"
