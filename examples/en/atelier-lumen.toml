# ─────────────────────────────────────────────────────────────
# Example register — Atelier Lumen (FICTIONAL COMPANY)
#
# Atelier Lumen designs and sells light fittings: 180 employees, a head office, a warehouse and an
# online shop (manufacturing is outsourced). Information system: Active Directory, Microsoft 365,
# a file server, backups on a NAS on the internal network plus a weekly tape copy, VPN remote
# access for 40 employees.
# It is the company of the tabletop exercise in the incident-response-playbook repository
# (document D06): this register takes up the weaknesses the exercise brought to light.
#
# Method: iso27005-5x5. Appetite: "Low". The people's names are made up.
# ─────────────────────────────────────────────────────────────
kind = "register"
format = 1
method = "iso27005-5x5"
lang = "en"
organisation = "Atelier Lumen (fictional company)"
assessed_on = 2026-09-15
assessor = "Risk committee (CISO, CIO, CFO, DPO)"

# ── R01: the tabletop exercise scenario ─────────────────────
[[risks]]
id = "R01"
title = "Ransomware encrypting the file server and the backups"
description = "An attacker gets in through the VPN with a stolen password, moves to the file server, then encrypts the shares and the backups on the NAS, which is reachable from the same network."
category = "Cybersecurity"
owner = "Julien Morel, CIO"
assets = ["File server", "Backup NAS", "Active Directory"]
threat = "Criminal group spreading ransomware, with double extortion"
vulnerability = "VPN without multi-factor authentication; backup NAS reachable from the office network"
gdpr = true
nis2 = false
inherent = { likelihood = 4, impact = 5 }
existing_controls = ["Antivirus on workstations and servers", "Weekly tape copy, kept in a safe"]
residual = { likelihood = 3, impact = 4 }
treatment = "reduce"
review = { last = 2026-10-15, next = 2027-01-15 }
iso27001 = ["5.17", "8.7", "8.13", "8.22"]
attack = ["T1133", "T1078", "T1486", "T1490"]
playbooks = ["P02", "P01"]

[[risks.measures]]
title = "Multi-factor authentication on the VPN"
owner = "Julien Morel, CIO"
due = 2026-10-15
status = "done"
iso27001 = ["8.5"]

[[risks.measures]]
title = "Immutable backups, daily offline copy"
owner = "Julien Morel, CIO"
due = 2026-10-31
status = "done"
iso27001 = ["8.13"]

[[risks.measures]]
title = "EDR on all workstations and servers, monitored 24/7"
owner = "Managed service provider"
due = 2026-12-15
status = "in-progress"
iso27001 = ["8.7", "8.16"]

[[risks.measures]]
title = "Move the backup NAS to a dedicated network"
owner = "Julien Morel, CIO"
due = 2027-01-31
status = "planned"
iso27001 = ["8.22"]

[[risks.history]]
on = 2026-09-15
by = "Risk committee"
change = "Risk created after the tabletop exercise: NAS reachable and VPN without MFA."

[[risks.history]]
on = 2026-10-15
by = "Julien Morel"
change = "MFA live on the VPN; residual likelihood lowered from 4 to 3."

# ── R02 ─────────────────────────────────────────────────────
[[risks]]
id = "R02"
title = "Payment fraud through supplier impersonation"
description = "A fraudster poses as a supplier and gets its bank details changed; the following payments go to the fraudster's account."
category = "Fraud"
owner = "Nadia Ferrand, CFO"
assets = ["Supplier payment process", "Accounting mailbox"]
threat = "Fraudster running fake-supplier scams"
vulnerability = "Bank details changed on the strength of a single email"
gdpr = false
nis2 = false
inherent = { likelihood = 4, impact = 4 }
existing_controls = ["Two signatures for transfers above €10,000"]
residual = { likelihood = 2, impact = 4 }
treatment = "reduce"
review = { last = 2026-09-15, next = 2027-03-15 }
acceptance = { by = "Nadia Ferrand", role = "Risk owner", on = 2026-10-01, until = 2027-10-01, rationale = "Systematic call-backs and training bring likelihood down to 2; impact stays major, but a further control is not proportionate today." }
iso27001 = ["5.14", "6.3"]
attack = ["T1566", "T1656"]
playbooks = ["P07", "P04"]

[[risks.measures]]
title = "Mandatory call-back, on a number already on file, before any change of bank details"
owner = "Nadia Ferrand, CFO"
due = 2026-09-30
status = "done"
iso27001 = ["5.14"]

[[risks.measures]]
title = "Payment fraud training for the accounting team"
owner = "Human resources manager"
due = 2026-09-30
status = "done"
iso27001 = ["6.3"]

# ── R03 ─────────────────────────────────────────────────────
[[risks]]
id = "R03"
title = "Breach of the online shop's customer data"
description = "A flaw in the shop application lets an attacker extract customer accounts (identity, addresses, order history)."
category = "Data protection"
owner = "Camille Roy, e-commerce manager"
assets = ["Online shop", "Customer database"]
threat = "Attacker exploiting exposed web applications"
vulnerability = "Shop plug-ins rarely updated; no penetration test for two years"
gdpr = true
nis2 = false
inherent = { likelihood = 3, impact = 4 }
existing_controls = ["Hosting with a certified provider", "Payment handled by a payment service provider"]
residual = { likelihood = 2, impact = 4 }
treatment = "reduce"
review = { last = 2026-09-15, next = 2027-03-15 }
iso27001 = ["8.8", "8.26", "8.28"]
attack = ["T1190"]
playbooks = ["P03"]

[[risks.measures]]
title = "Web application firewall (WAF) in front of the shop"
owner = "Camille Roy"
due = 2026-10-15
status = "done"
iso27001 = ["8.20"]

[[risks.measures]]
title = "Penetration test of the shop and fixing of the flaws found"
owner = "Camille Roy"
due = 2026-10-31
status = "in-progress"
iso27001 = ["8.8", "8.29"]

# ── R04 ─────────────────────────────────────────────────────
[[risks]]
id = "R04"
title = "Microsoft 365 accounts compromised through phishing"
description = "An employee types their password into a fake sign-in page; the attacker reads their mailbox and uses it to phish customers and colleagues."
category = "Cybersecurity"
owner = "Julien Morel, CIO"
assets = ["Microsoft 365 (email, OneDrive, Teams)"]
threat = "Phishing campaigns targeting credentials"
vulnerability = "Multi-factor authentication not enforced on every account"
gdpr = true
nis2 = false
inherent = { likelihood = 4, impact = 3 }
existing_controls = ["Microsoft 365 spam filtering"]
residual = { likelihood = 2, impact = 3 }
treatment = "reduce"
review = { last = 2026-10-01, next = 2027-04-01 }
acceptance = { by = "Julien Morel", role = "Risk owner", on = 2026-10-01, until = 2027-10-01, rationale = "MFA enforced and conditional access in place; the remaining risk comes from session phishing, covered by monitoring." }
iso27001 = ["5.17", "8.5"]
attack = ["T1566.002", "T1078.004"]
playbooks = ["P07", "P04"]

[[risks.measures]]
title = "MFA enforced on every account, without exception"
owner = "Julien Morel, CIO"
due = 2026-09-30
status = "done"
iso27001 = ["8.5"]

[[risks.measures]]
title = "Conditional access: sign-ins allowed from managed devices only"
owner = "Julien Morel, CIO"
due = 2026-09-30
status = "done"
iso27001 = ["5.15"]

# ── R05 ─────────────────────────────────────────────────────
[[risks]]
id = "R05"
title = "Prolonged outage of the online shop"
description = "Hosting provider failure or denial-of-service attack during a peak sales period (sales, end of year)."
category = "Business continuity"
owner = "Camille Roy, e-commerce manager"
assets = ["Online shop"]
threat = "Provider failure; denial-of-service attack"
vulnerability = "Single hosting provider, no standby site"
gdpr = false
nis2 = false
inherent = { likelihood = 3, impact = 3 }
residual = { likelihood = 3, impact = 2 }
treatment = "transfer"
transfer = { to = "Hosting provider (availability commitment with penalties) and cyber insurer (business interruption)" }
review = { last = 2026-09-15, next = 2027-03-15 }
acceptance = { by = "Camille Roy", role = "Risk owner", on = 2026-09-15, until = 2027-09-15, rationale = "Financial losses are covered by the contract and the insurance; a standby site would cost more than the remaining risk." }
iso27001 = ["5.20", "5.23", "5.30"]
attack = ["T1498"]
playbooks = ["P06"]

# ── R06 ─────────────────────────────────────────────────────
[[risks]]
id = "R06"
title = "Theft or loss of a laptop"
description = "A sales representative's laptop is stolen while travelling; the customer files on it are exposed."
category = "Equipment"
owner = "Julien Morel, CIO"
assets = ["Sales team laptops"]
threat = "Opportunistic theft"
vulnerability = "Frequent mobile use"
gdpr = true
nis2 = false
inherent = { likelihood = 3, impact = 3 }
residual = { likelihood = 3, impact = 1 }
treatment = "reduce"
review = { last = 2026-09-15, next = 2027-09-15 }
iso27001 = ["7.9", "8.1", "8.24"]

[[risks.measures]]
title = "Full-disk encryption (BitLocker) and remote wipe"
owner = "Julien Morel, CIO"
due = 2026-09-15
status = "done"
iso27001 = ["8.24"]

# ── R07 ─────────────────────────────────────────────────────
[[risks]]
id = "R07"
title = "Access kept after an employee leaves or a service contract ends"
description = "A former employee or contractor keeps an active account, sometimes privileged, and uses it or has it stolen."
category = "Access management"
owner = "Human resources manager"
assets = ["Active Directory", "Microsoft 365", "VPN"]
threat = "Malicious former employee or contractor; theft of a dormant account"
vulnerability = "No leaver procedure shared by human resources and IT"
gdpr = false
nis2 = false
inherent = { likelihood = 2, impact = 4 }
residual = { likelihood = 1, impact = 4 }
treatment = "reduce"
review = { last = 2026-09-15, next = 2027-09-15 }
iso27001 = ["5.18", "6.5", "8.2"]
attack = ["T1078"]
playbooks = ["P05"]

[[risks.measures]]
title = "Leaver procedure shared by HR and IT, and quarterly account review"
owner = "Human resources manager"
due = 2027-03-31
status = "planned"
iso27001 = ["5.18", "6.5"]

# ── R08: closed risk ────────────────────────────────────────
[[risks]]
id = "R08"
title = "Disaster in the warehouse server room"
description = "Water damage or a fire destroys the servers of the old logistics application, hosted at the warehouse."
category = "Physical security"
owner = "Julien Morel, CIO"
status = "closed"
assets = ["Old logistics application"]
threat = "Water damage, fire"
vulnerability = "Technical room without fire detection, under a fragile roof"
gdpr = false
nis2 = false
inherent = { likelihood = 2, impact = 4 }
residual = { likelihood = 1, impact = 1 }
treatment = "avoid"
review = { last = 2026-06-30, next = 2027-06-30 }

[[risks.history]]
on = 2026-06-30
by = "Julien Morel"
change = "Logistics application moved to a SaaS vendor; warehouse servers removed. Risk closed."
