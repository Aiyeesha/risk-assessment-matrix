# ─────────────────────────────────────────────────────────────
# Registre d'exemple — Atelier Lumen (ENTREPRISE FICTIVE)
#
# Atelier Lumen conçoit et vend des luminaires : 180 salariés, un siège, un entrepôt et une
# boutique en ligne (fabrication sous-traitée). Système d'information : annuaire Active Directory,
# Microsoft 365, serveur de fichiers, sauvegardes sur un NAS du réseau interne et copie
# hebdomadaire sur bande, accès distant par VPN pour 40 salariés.
# C'est l'entreprise de l'exercice sur table du dépôt incident-response-playbook (document D06) :
# ce registre reprend les faiblesses que l'exercice a mises au jour.
#
# Méthode : iso27005-5x5. Appétence : « Faible ». Les noms de personnes sont inventés.
# ─────────────────────────────────────────────────────────────
kind = "register"
format = 1
method = "iso27005-5x5"
lang = "fr"
organisation = "Atelier Lumen (entreprise fictive)"
assessed_on = 2026-09-15
assessor = "Comité des risques (RSSI, DSI, DAF, DPO)"

# ── R01 : le scénario de l'exercice sur table ───────────────
[[risks]]
id = "R01"
title = "Rançongiciel chiffrant le serveur de fichiers et les sauvegardes"
